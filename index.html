<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIFORCE DEBUG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#02010a}
.wrap{position:relative;width:100%;max-width:500px;margin:0 auto;line-height:0}
.bg{width:100%;display:block}
.hotspot{position:absolute;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;color:#fff;border:2px dashed #fff}
/* COLORES PARA VERLOS */
.m-tw,.m-ig,.m-tt,.m-yt{background:rgba(255,0,0,0.5)} /* MegaMan ROJO */
.f-tw,.f-tt,.f-yt,.f-ig{background:rgba(0,255,0,0.5)} /* Flacillo VERDE */
.k-yt,.k-tt,.k-ig{background:rgba(0,100,255,0.5)} /* Kuroi AZUL */

.m-tw{left:6%;top:51.0%;width:20%;height:3.8%}
.m-ig{left:28.2%;top:51.0%;width:20%;height:3.8%}
.m-tt{left:50.5%;top:51.0%;width:20%;height:3.8%}
.m-yt{left:72.8%;top:51.0%;width:21%;height:3.8%}
.f-tw{left:6%;top:58.9%;width:20%;height:3.8%}
.f-tt{left:28.2%;top:58.9%;width:20%;height:3.8%}
.f-yt{left:50.5%;top:58.9%;width:20%;height:3.8%}
.f-ig{left:72.8%;top:58.9%;width:21%;height:3.8%}
.k-yt{left:6%;top:66.5%;width:27%;height:4%}
.k-tt{left:36.5%;top:66.5%;width:27%;height:4%}
.k-ig{left:67%;top:66.5%;width:27%;height:4%}
</style>
</head>
<body>
<div class="wrap">
<img class="bg" src="triforce_bg.jpg" alt="Triforce">
<a class="hotspot m-tw">M-TW</a>
<a class="hotspot m-ig">M-IG</a>
<a class="hotspot m-tt">M-TT</a>
<a class="hotspot m-yt">M-YT</a>
<a class="hotspot f-tw">F-TW</a>
<a class="hotspot f-tt">F-TT</a>
<a class="hotspot f-yt">F-YT</a>
<a class="hotspot f-ig">F-IG</a>
<a class="hotspot k-yt">K-YT</a>
<a class="hotspot k-tt">K-TT</a>
<a class="hotspot k-ig">K-IG</a>
</div>
</body>
</html>
