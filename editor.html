<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDITOR TRIFORCE V2</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif}
.top{position:sticky;top:0;z-index:99;background:#111;padding:10px;text-align:center}
button{padding:12px 20px;background:#0f0;font-weight:bold;border:0;font-size:16px;width:100%}
.wrap{position:relative;width:100%;max-width:500px;margin:0 auto;touch-action:none}
.bg{width:100%;display:block}
.box{position:absolute;border:2px solid yellow;background:rgba(255,255,0,0.4);display:flex;align-items:center;justify-content:center;font-size:9px;color:#000;font-weight:bold}
#out{width:100%;max-width:500px;margin:10px auto;background:#222;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-all;min-height:50px}
</style>
</head>
<body>
<div class="top">
<h3>Arrastra los amarillos</h3>
<button onclick="generar()">👉 TOCA AQUÍ PARA GENERAR CÓDIGO 👈</button>
<div id="out">Aquí aparecerá el código...</div>
</div>
<div class="wrap" id="wrap">
<img class="bg" src="triforce_bg.jpg" id="bg">
</div>
<script>
const datos=[
{id:'m-tw',x:6,y:57.8,w:22.5,h:6.2},{id:'m-ig',x:30.5,y:57.8,w:22.5,h:6.2},{id:'m-tt',x:54,y:57.8,w:20,h:6.2},{id:'m-yt',x:76.5,y:57.8,w:20.5,h:6.2},
{id:'f-tw',x:6,y:68.9,w:22.5,h:6.2},{id:'f-tt',x:30.5,y:68.9,w:22.5,h:6.2},{id:'f-yt',x:54,y:68.9,w:20,h:6.2},{id:'f-ig',x:76.5,y:68.9,w:20.5,h:6.2},
{id:'k-yt',x:5.5,y:80.1,w:28,h:6.5},{id:'k-tt',x:37.5,y:80.1,w:28,h:6.5},{id:'k-ig',x:69.5,y:80.1,w:27,h:6.5},
];
const wrap=document.getElementById('wrap');
datos.forEach(d=>{
 let div=document.createElement('div');
 div.className='box'; div.id=d.id; div.textContent=d.id;
 div.style.left=d.x+'%'; div.style.top=d.y+'%'; div.style.width=d.w+'%'; div.style.height=d.h+'%';
 wrap.appendChild(div);
 let sx,sy,ox,oy;
 div.addEventListener('touchstart',e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY; ox=parseFloat(div.style.left); oy=parseFloat(div.style.top);});
 div.addEventListener('touchmove',e=>{
   e.preventDefault();
   let dx=(e.touches[0].clientX-sx)/wrap.clientWidth*100;
   let dy=(e.touches[0].clientY-sy)/wrap.clientHeight*100;
   div.style.left=(ox+dx)+'%'; div.style.top=(oy+dy)+'%';
 },{passive:false});
});
function generar(){
 let css='';
 document.querySelectorAll('.box').forEach(b=>{
   css+=`.${b.id}{left:${parseFloat(b.style.left).toFixed(2)}%;top:${parseFloat(b.style.top).toFixed(2)}%;width:${parseFloat(b.style.width).toFixed(2)}%;height:${parseFloat(b.style.height).toFixed(2)}%}\n`;
 });
 document.getElementById('out').textContent=css;
 alert("Código generado! Copia el texto negro de arriba");
}
</script>
</body>
</html>
